<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movies Management System</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>🎬 Movies Management System</h1>
    <input type="text" id="search" placeholder="Search movies by title...">
    <button id="showFormBtn">➕ Add Movie</button>
  </header>

  <!-- Add Movie Form (Hidden by default) -->
  <section class="add-movie" id="addMovieSection" style="display:none;">
    <h2>Add a New Movie</h2>
    <form id="movieForm">
      <input type="text" id="title" placeholder="Title" required>
      <input type="number" id="year" placeholder="Year" required>
      <input type="text" id="director" placeholder="Director" required>
      <input type="text" id="producer" placeholder="Producer" required>
      <input type="text" id="language" placeholder="Language" required>
      <input type="text" id="hero" placeholder="Hero" required>
      <input type="text" id="heroine" placeholder="Heroine" required>
      <input type="text" id="villain" placeholder="Villain">
      <input type="number" step="0.1" id="rating" placeholder="Rating" required>
      <input type="url" id="poster" placeholder="Poster URL" required>
      <button type="submit">Add Movie</button>
    </form>
  </section>

  <section class="movies-grid" id="moviesGrid">
    <!-- Movies will appear here -->
  </section>
</body>
</html>
